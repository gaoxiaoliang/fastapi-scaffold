[project]
name = "fastapi-scaffold"
version = "0.1.0"
description = "A production-oriented FastAPI scaffold with JWT authentication"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "uvicorn[standard]==0.40.0",
  "fastapi[standard]==0.128.7",
  "pydantic==2.12.5",
  "email-validator==2.3.0",
  "pydantic-settings==2.12.0",
  "aiosqlite==0.22.1",
  "python-jose==3.5.0",
  "bcrypt==5.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
